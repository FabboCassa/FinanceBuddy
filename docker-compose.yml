# Shared app environment (DRY via YAML anchor). Per-service overrides extend it.
# Secrets are read from the gitignored .env via ${VAR:-default} interpolation, so
# this committed file never contains real credentials. Set real values in .env.
x-app-env: &app-env
  DEBUG: "${DEBUG:-True}"
  SECRET_KEY: "${SECRET_KEY:-django-insecure-dev-only-change-me}"
  DB_NAME: "${DB_NAME:-finance_buddy}"
  DB_USER: "${DB_USER:-postgres}"
  DB_PASSWORD: "${DB_PASSWORD:-postgres_pwd}"
  DB_HOST: db
  DB_PORT: "5432"
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  USE_REAL_NLP: "${USE_REAL_NLP:-False}"
  HF_HOME: /models/huggingface
  # Alert channels (optional; empty → channel skipped). Real values in .env.
  TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
  TELEGRAM_CHAT_ID: "${TELEGRAM_CHAT_ID:-}"
  DISCORD_WEBHOOK_URL: "${DISCORD_WEBHOOK_URL:-}"
  ALERT_EMAIL_RECIPIENTS: "${ALERT_EMAIL_RECIPIENTS:-}"

x-app-build: &app-build
  build: .
  volumes:
    - .:/app
    - hf_cache:/models/huggingface
  depends_on:
    - db
    - redis

services:
  db:
    image: postgres:15-alpine
    container_name: fb_db
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME:-finance_buddy}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres_pwd}
    ports:
      - "5435:5432"

  redis:
    image: redis:7-alpine
    container_name: fb_redis
    ports:
      - "6379:6379"

  # Web is the single owner of migrations + Phase 1 bootstrap on startup.
  web:
    <<: *app-build
    container_name: fb_web
    command: python manage.py runserver 0.0.0.0:8000
    # Host 8001 → container 8000: leaves host 8000 free for a local PyCharm runserver,
    # so the containerized web and the local dev server can run side by side.
    ports:
      - "8001:8000"
    environment:
      <<: *app-env
      RUN_MIGRATIONS: "True"
      RUN_BOOTSTRAP: "True"

  celery_worker:
    <<: *app-build
    container_name: fb_celery_worker
    command: celery -A finance_buddy worker --loglevel=info
    environment:
      <<: *app-env
    depends_on:
      - db
      - redis
      - web

  celery_beat:
    <<: *app-build
    container_name: fb_celery_beat
    command: celery -A finance_buddy beat --loglevel=info
    environment:
      <<: *app-env
    depends_on:
      - db
      - redis
      - web

volumes:
  postgres_data:
  hf_cache:
